# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Version updates are not automatically enabled on forks when a dependabot.yml configuration file is present:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates#enabling-version-updates-on-forks

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests.   Look for `package.json` and `lock` files in the `root` directory
    schedule:
      interval: "daily"
    # Majors we can't take yet. Jasmine 6+ drops Karma (E-226 replaces Karma with Vitest, then
    # remove these two); TypeScript 7 waits on Angular's peer range (>=6.0 <6.1 in Angular 22).
    ignore:
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

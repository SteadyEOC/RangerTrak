# Gates external pull requests on signing CLA.md (E-23 / ADR D-01, ADR-0006). Enabled
# 2026-09-26. Signatures are committed to the `cla-signatures` branch using the
# CLA_SIGNATURES_TOKEN repo secret (a fine-grained PAT: Contents and Pull requests, read and
# write, this repo only). If that secret is missing or expired, runs fail rather than
# silently passing - deliberate, so an unsigned outside PR can never slip through.
#
# `allowlist` is GitHub LOGINS, not git author names: the maintainer's login is VashJuan
# (git commits say "JCornelison", which is a different GitHub account). The bots are the two
# that open PRs here.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: VashJuan,dependabot[bot],ImgBotApp,imgbot[bot]
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >
            Thanks for the pull request! Before it can be reviewed, please read
            [CLA.md](https://github.com/${{ github.repository }}/blob/main/CLA.md) and reply
            to this comment with: `I have read the CLA Document and I hereby sign the CLA`

# Build RangerTrak and deploy it to Cloudflare Workers as a static-asset Worker.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Manual runs, so a deploy can be triggered without pushing a commit.
  workflow_dispatch:

# Never let two deploys race; queue them instead.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tools/regional/ holds scripts and docs only; real rosters, crosswalks and photos stay
      # outside git (ADR D-35). Then run those tools end to end on the made-up demo region.
      - name: Regional tools hold no data
        run: npm run check:regional
      - name: Regional tools test (fictional demo region)
        run: npm run test:regional

      # `ng build` compiles only *reachable* files, so it is not a typecheck - an
      # unreferenced file can carry errors indefinitely while builds stay green.
      # See the Testing section of DEVELOPING.md.
      - name: Typecheck
        run: npm run lint:tsc

      # ESLint (ADR D-57). The domain/ and component-storage boundary rules are errors and
      # fail the deploy; the recommended angular-eslint/typescript-eslint sets only warn.
      - name: Lint (boundary rules gate)
        run: npm run lint:ts

      # The suite is expected to be all green (80 specs). Deploying past a red
      # suite to an emergency-response tool is not a trade worth making.
      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      # worker/index.js (the feedback endpoint, the PMTiles Range shim) isn't Angular and
      # isn't reachable by Karma - plain node:test, run separately.
      - name: Worker unit tests
        run: npm run test:worker

      - name: Build
        run: npm run build

      # Roadmap section 9e: keys are still inlined into main-XXXX.js by the
      # secrets.json import in settings.service.ts. This fails the job rather
      # than republishing them. See tools/check-no-secrets.js.
      - name: Check for API keys in the build
        run: npm run check:secrets

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A successful deploy and a working site are two different facts. Roadmap 19g:
      # a mis-scoped Cloudflare redirect rule made the apex 301 to itself for days
      # while this workflow stayed green, and the cached PWA hid it from the only
      # person likely to notice. This asserts the hostname actually serves the bundle
      # we just built - see tools/check-deployed.js.
      - name: Verify the deploy reached the public hostname
        run: node tools/check-deployed.js

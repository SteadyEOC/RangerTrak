<rangertrak-page [title]="title" [description]="pageDescr">
  <div class="x404">
    <p class="x404__line">Station not found. Say again?</p>
    <p>There is no page at <code class="x404__path">{{ path }}</code> in RangerTrak.</p>

    @if (guesses.length) {
    <p>Did you mean:</p>
    <div class="x404__guesses" data-testid="x404-guesses">
      @for (g of guesses; track g.route) {
      <a matButton="outlined" [routerLink]="g.route">{{ g.label }}</a>
      }
    </div>
    }

    <rangertrak-help-search [initialQuery]="searchFor" [limit]="5"></rangertrak-help-search>

    <p><a matButton="filled" routerLink="/">Go to Entry</a></p>
  </div>
</rangertrak-page>

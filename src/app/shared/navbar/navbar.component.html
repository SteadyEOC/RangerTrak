<nav class="main-nav">
  <!-- E-63b: the brand mark IS the Home affordance now - the separate "Home" nav item is
       gone. routerLinkActive mirrors what "Home" used to show: active only on an exact
       match, not on every route (this link's target).

       Maintainer ask, 2026-09-23: "too small, uses the favicon, not the travelling logo."
       Was the tab-size cut (assets/icons/favicon.svg's own compact geometry, hand-simplified
       to survive 26px) with a static 2-wave signal. Now the SAME path data as
       assets/icons/rangertrak-mark-animated.svg - map pin + handheld radio + the real
       3-wave signal, animated (see the <style> block below, copied verbatim from that
       file) - reused wholesale rather than hand-fit to a smaller box, so no coordinate here
       was eyeballed. Rendered at 24x40 (viewBox stays the source's own 155x260, so nothing
       is distorted) - a genuinely bigger, taller icon than the old 26x26 square, which is
       the point.

       That source file fills the pin/radio navy (#12263F) on the assumption of a light
       background - the wrong assumption here, since .main-nav's chrome is dark under every
       skin in both light/dark mode (navbar.component.scss's #gitLogo comment already
       establishes this). rangertrak-tile.svg already solves the same problem for the dark
       PWA tile background by reversing to a white pin - this does the CSS-native version of
       that: currentColor (this component's existing --rt-chrome-ink treatment) instead of a
       hardcoded white, so it still tracks the skin. The three slot marks on the radio body
       are cut through to var(--rt-chrome) (the navbar's own background token) rather than
       kept as fixed white - same "hole punched through, not a second colour" trick the old
       antenna cutout used, just via a CSS var instead of fill-rule since these are separate
       rects layered on the body, not one compound path. -->
  <span title="RangerTrak" class="title">
    <a class="brand" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <!-- 2026-09-28, John: "enlarge to fill the navbar's vertical space better" - grown from
           24x40 to 26x44 (same aspect, viewBox untouched) to match --rt-tap-min (44px), which
           is what actually sets the row's height via the icon buttons in .rightAlign. Since
           that's already the row's height ceiling, this fills it without making the sticky
           header any taller. -->
      <svg class="brand-icon" width="26" height="44" viewBox="0 0 155 260" aria-hidden="true"
        [class.rt-pulse-a]="pulseKey() % 2 === 0" [class.rt-pulse-b]="pulseKey() % 2 !== 0"
        [class.rt-pulse-twice]="pulseTwice()">
        <!-- 2026-09-28, John: "animated logo waves, on events only" - this used to run
             `infinite`, all the time, whether or not anything was happening. Now the
             animation is finite (one pass per trigger) and fires only for: page load (the
             rt-pulse-a class below is already present on first render, so the animation
             plays once as soon as this SVG paints - no JS needed for that trigger either),
             a submitted radio log entry (NavbarComponent.pulseKey, incremented from
             RadioLogService.reportSubmittedSignal - see navbar.component.ts), and
             hover/focus of the brand link (the two CSS-only rules below - independent of
             pulseKey, so hovering never needs a class write). rt-pulse-a/rt-pulse-b are two
             classes NavbarComponent alternates between on each trigger; they point at two
             identical keyframes with different names, because only a change of animation
             name restarts an already-finished animation (see the 2026-09-29 note below). -->
        <style>
          /* 2026-09-30, John: E-146 - resting opacity 0.5 -> 0.9; at 0.5 the waves read as
             washed-out orange. The event pulse still reads as one: it dips to 0.15 first,
             then swells to 1. */
          .brand-icon .wave {
            opacity: 0.9;
          }

          /* 2026-09-29, John: two passes on every page load and in-app page change
             (rt-pulse-twice), one per submitted radio log entry. Fixed the same day: a
             finished CSS animation only restarts when its animation-NAME changes, not when
             an identically styled class swaps in, so rt-pulse-a and rt-pulse-b now use two
             identical keyframes under different names. And the per-wave stagger is a custom
             property the shorthand reads: the old separate animation-delay rules lost to the
             shorthand's own reset (lower specificity), so all three waves fired together. */
          .brand-icon.rt-pulse-a .wave,
          .brand:hover .brand-icon .wave,
          .brand:focus-visible .brand-icon .wave {
            animation: rt-signal-a 1.6s ease-out var(--rt-wave-delay, 0s) var(--rt-pulse-count, 1);
          }

          .brand-icon.rt-pulse-b .wave {
            animation: rt-signal-b 1.6s ease-out var(--rt-wave-delay, 0s) var(--rt-pulse-count, 1);
          }

          .brand-icon.rt-pulse-twice {
            --rt-pulse-count: 2;
          }

          /* Staggered so the smallest ring (nearest the antenna) fires first and the
             largest (nearest the edge) fires last - reads as one ripple moving outward,
             not three rings blinking in place together. */
          .brand-icon .wave-2 {
            --rt-wave-delay: 0.15s;
          }

          .brand-icon .wave-3 {
            --rt-wave-delay: 0.3s;
          }

          @keyframes rt-signal-a {
            0% {
              opacity: 0.15;
              stroke: var(--rt-signal);
            }

            35% {
              opacity: 1;
              /* Gentle colour pulse toward the skin's accent token, not a fixed literal -
                 see .brand-icon__signal's own comment on why --rt-signal itself doesn't
                 vary by skin the way --rt-accent does. */
              stroke: color-mix(in srgb, var(--rt-signal), var(--rt-accent) 55%);
            }

            70% {
              opacity: 1;
              stroke: var(--rt-signal);
            }

            100% {
              opacity: 0;
              stroke: var(--rt-signal);
            }
          }

          @keyframes rt-signal-b {
            0% {
              opacity: 0.15;
              stroke: var(--rt-signal);
            }

            35% {
              opacity: 1;
              /* Gentle colour pulse toward the skin's accent token, not a fixed literal -
                 see .brand-icon__signal's own comment on why --rt-signal itself doesn't
                 vary by skin the way --rt-accent does. */
              stroke: color-mix(in srgb, var(--rt-signal), var(--rt-accent) 55%);
            }

            70% {
              opacity: 1;
              stroke: var(--rt-signal);
            }

            100% {
              opacity: 0;
              stroke: var(--rt-signal);
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .brand-icon .wave {
              /* !important: without it, the higher-specificity trigger rules above (two
                 classes/pseudo-classes) would win over this plain .wave rule and animate
                 anyway. */
              animation: none !important;
            }
          }
        </style>
        <g fill="none" stroke="currentColor" stroke-linejoin="round">
          <path d="M 52 239 L 18.4 175.8 A 38 38 0 1 1 85.6 175.8 Z" stroke-width="12" />
          <path d="M 52 96 L 52 150" stroke-width="5" stroke-linecap="round" />

          <rect x="47.5" y="170" width="9" height="4" rx="2" />
          <rect x="47.5" y="182" width="9" height="4" rx="2" />

          <path class="wave wave-1" transform="translate(52,88) scale(0.80) translate(-52,-88)"
            d="M 74.94 55.23 A 40 40 0 0 1 82.64 113.71" />
          <path class="wave wave-2" transform="translate(52,88) scale(1.30) translate(-52,-88)"
            d="M 74.94 55.23 A 40 40 0 0 1 82.64 113.71" />
          <path class="wave wave-3" transform="translate(52,88) scale(1.85) translate(-52,-88)"
            d="M 74.94 55.23 A 40 40 0 0 1 82.64 113.71" />
        </g>
      </svg>
      RangerTrak™
    </a>

    <!-- D-31 named these by what a scribe reaches for, not by engine, back when the two

    <li><a [routerLink]="['/mission']" routerLinkActive="active" (click)="closeNav()"

    }
    <!-- Renamed from "Help" to "Help" - the maintainer's framing: "Too many confusing
         things are on the main menu!" Log's own nav item is gone the same day; it's
         reachable from this Help page instead (see help.component.html). Route stays

    <!-- 2026-09-27, John: the After Action (now "AAR notes") nav item added 2026-09-27 (E-116)
         came off the menu the same day - "too many confusing things on the main menu" applies
         here too. The /after-action route and its fieldModeGuard-free reachability stay

    <li><a [routerLink]="['/help']" routerLinkActive="active" (click)="closeNav()"
        title="How to use RangerTrak, and feedback">Help</a></li>
    <li *ngIf="isNavigating()" class="Navbar__progressBar">Loading... <span class="smaller"> (Please 'Refresh' the

      <mat-progress-bar mode="indeterminate">
      </mat-progress-bar>

  <span class="rightAlign">
    <!-- 2026-08-26: phone-width only (see navbar.component.scss's bp.phone block) - the
         link list above collapses behind this below 575px instead of wrapping onto extra
         rows. aria-controls/aria-expanded describe the <ul> above for assistive tech;

    <button type="button" class="nav-toggle" (click)="toggleNav()" aria-controls="mainNavLinks"
      [attr.aria-expanded]="navOpen()" [attr.aria-label]="(navOpen() ? 'Close' : 'Open') + ' navigation menu'"
      [attr.title]="(navOpen() ? 'Close' : 'Open') + ' navigation menu'">
      @if (navOpen()) {
      <!-- 2026-09-28, John: 22px -> 24px, matching the theme/skin/git icons next to it -
           this was the second of the "two sizes" in play here. -->
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      } @else {
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      }
    </button>

    <!-- Light/dark override. 'auto' follows the OS/browser scheme (styles/_tokens.scss's
         light-dark() default); 'light'/'dark' pin it. A sun/moon toggle beats relying on the
         OS setting alone here - a scribe's device theme rarely tracks actual field light,
         daylight glare vs. a dim vehicle cab at night, the way it would used indoors all day. -->
    <button type="button" class="theme-toggle" (click)="theme.cycle()"
      [attr.aria-label]="'Theme: ' + theme.mode() + '. Click to change.'"
      [title]="'Theme: ' + theme.mode() + ' (click to change)'">
      @if (theme.mode() === 'light') {
      <!-- 2026-09-28, John: 20px -> 24px, matching skin/nav-toggle/git icons in the same row. -->
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="currentColor" />

          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />

      </svg>

      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" />
      </svg>
      }
    </button>

    <!-- 2026-08-26: the mockup showed three color schemes (styles/_chrome.scss's
         ridgeline/command/nightwatch), but there was never a way to actually pick one - it
         was a compile-time edit to styles/_active-skin.scss, one line, then a rebuild. This
         is that made real: shared/services/skin.service.ts owns the choice, a `data-skin`
         attribute on <html> is all either stylesheet (styles.scss/_tokens.scss) reads. A
         menu, not a cycle button like the theme toggle above - three NAMED options read
         better as a list with the current one checked than as an unlabelled icon a scribe
         has to click through blind. -->
    <!-- 2026-09-28, John: AAR note - "after choosing a colour scheme on a 390px phone, the
         whole screen stays shifted." Root cause: this button lives inside the sticky header
         (app.component.scss's .app-sticky-header, `position: sticky`); MatMenuTrigger
         restores focus to it once the menu closes (correct, keyboard-first behavior - do NOT
         disable via matMenuTriggerRestoreFocus, that's an accessibility regression), but
         focusing a sticky-positioned element makes the browser scroll to its STATIC in-flow
         position rather than its current sticky one - for the navbar, that's the very top of
         the page. onSkinMenu{Opened,Closed}() below save/restore the real scroll position
         around that jump instead. -->
    <button type="button" class="skin-toggle" [matMenuTriggerFor]="skinMenu"
      (menuOpened)="onSkinMenuOpened()" (menuClosed)="onSkinMenuClosed()"
      aria-label="Color scheme" title="Color scheme">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="8" r="1.6" fill="currentColor" />
        <circle cx="8.2" cy="13" r="1.6" fill="currentColor" />
        <circle cx="15.8" cy="13" r="1.6" fill="currentColor" />
      </svg>
    </button>
    <mat-menu #skinMenu="matMenu">
      @for (opt of skins; track opt.value) {
      <button mat-menu-item (click)="skin.set(opt.value)">
        <span class="skin-swatch" [style.background]="opt.accent" aria-hidden="true"></span>
        {{ opt.label }}
        @if (skin.skin() === opt.value) {
        <span class="skin-check" aria-hidden="true">&check;</span>
        }
      </button>
      }
    </mat-menu>

    <!-- E-57(1) follow-up: install/update used to render here too, plus the footer's

    <!-- 2026-09-02: was a 32x32 PNG (GitHub-Mark-32px.png), PageSpeed-flagged "serves images

  </span>

<!-- https://material.io/components/menus
 mdc-top-app-bar
 -->

<nav class="main-nav">
  <!-- E-63b: the brand mark IS the Home affordance now - the separate "Home" nav item is
       gone. The icon is RangerTrak's own mark (map pin + handheld radio + signal), the
       same geometry as assets/icons/favicon.svg, inlined so it costs no asset request.
       It is the tab-size cut of the mark rather than the full one: at 26px the full
       mark's three thin waves merge and its pin ring closes up. The pin takes
       currentColor so it follows .title; only the signal carries brand colour, set in
       the component SCSS. routerLinkActive mirrors what "Home" used to show: active
       only on an exact match, not on every route (this link's target). -->
  <span title="RangerTrak" class="title">
    <a class="brand" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <svg class="brand-icon" width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <!-- The antenna is a hole punched through the pin (fill-rule evenodd), not a
             painted-on stripe, so it shows whatever the navbar background is and needs
             no second colour to stay in step with the theme. -->
        <path fill="currentColor" fill-rule="evenodd"
          d="M 11.5 29 L 6.26 21.84 A 6.5 6.5 0 1 1 16.74 21.84 Z
             M 10.4 12.6 L 12.6 12.6 L 12.6 24.2 L 10.4 24.2 Z" />
        <g class="brand-icon__signal" fill="none" stroke-width="3" stroke-linecap="round">
          <path d="M 21.89 5 A 12 12 0 0 1 20.69 18.71" />
          <path d="M 26.22 2.5 A 17 17 0 0 1 24.52 21.93" />
        </g>
      </svg>
      RangerTrak™
    </a>
  </span>

  <ul id="mainNavLinks" [class.open]="navOpen()">
    <!-- E-114 §1a (2026-08-31): a "field phone" device (FieldModeService.enable(), set once
         via the Entry welcome panel's first-run prompt) only ever needs Entry (reached via
         the brand/Home link above, not an <li> here) and Help - everything else is a
         command-post/scribe concern this device was deliberately scoped away from. Hidden
         here, not just left reachable-but-pointless, because app.routes.ts guards the
         underlying routes too (typing the URL directly would otherwise still work). -->
    @if (!fieldMode.enabled()) {
    <!-- D-31 named these by what a scribe reaches for, not by engine, back when the two
         engines shipped as separate nav items/pages. E-64 collapsed that to one page: one
         route, Leaflet shown by default, with an on-page switch to try MapLibre + PMTiles.
         So there is only one nav item now; the reasoning behind the label survives, it just
         has nothing left to disambiguate. -->
    <li><a [routerLink]="['/map']" routerLinkActive="active" (click)="closeNav()"
        title="Detailed worldwide map (Leaflet + OpenStreetMap) by default, with a switch to try the bundled MapLibre + PMTiles alternative engine.">Map</a>
    </li>
    <li><a [routerLink]="['/radio-log']" routerLinkActive="active" (click)="closeNav()"
        title="The chronological log of every field report - who, where, when, what.">Radio Log</a></li>
    <!-- New 2026-08-27: ICS-213 messages (field reports with "Also generate an ICS-213"
         checked) - a distinct, filtered view, not just Radio Log under another name. -->
    <li><a [routerLink]="['/messages']" routerLinkActive="active" (click)="closeNav()"
        title="ICS-213 general messages generated from field reports.">Messages</a></li>
    <li><a [routerLink]="['/rangers']" routerLinkActive="active" (click)="closeNav()">Rangers</a></li>
    <li><a [routerLink]="['/mission']" routerLinkActive="active" (click)="closeNav()">Mission</a></li>
    }
    <!-- Renamed from "Help" to "Help" - the maintainer's framing: "Too many confusing
         things are on the main menu!" Log's own nav item is gone the same day; it's
         reachable from this Help page instead (see help.component.html). Route stays
         /help - every internal link already uses routerLink, not a hardcoded path. -->
    <li><a [routerLink]="['/help']" routerLinkActive="active" (click)="closeNav()">Help</a></li>
    <li *ngIf="isNavigating()" class="Navbar__progressBar">Loading... <span class="smaller"> (Please 'Refresh' the
        page.)</span>
      <mat-progress-bar mode="indeterminate">
      </mat-progress-bar>
    </li>
  </ul>


  <!--================================================-->
  <span class="rightAlign">
    <!-- 2026-08-26: phone-width only (see navbar.component.scss's bp.phone block) - the
         link list above collapses behind this below 575px instead of wrapping onto extra
         rows. aria-controls/aria-expanded describe the <ul> above for assistive tech;
         hidden entirely at tablet-up via CSS, not [hidden], so it never steals a tab stop
         there. -->
    <button type="button" class="nav-toggle" (click)="toggleNav()" aria-controls="mainNavLinks"
      [attr.aria-expanded]="navOpen()" [attr.aria-label]="(navOpen() ? 'Close' : 'Open') + ' navigation menu'">
      @if (navOpen()) {
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      } @else {
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      }
    </button>

    <!-- Light/dark override. 'auto' follows the OS/browser scheme (styles/_tokens.scss's
         light-dark() default); 'light'/'dark' pin it. A sun/moon toggle beats relying on the
         OS setting alone here - a scribe's device theme rarely tracks actual field light,
         daylight glare vs. a dim vehicle cab at night, the way it would used indoors all day. -->
    <button type="button" class="theme-toggle" (click)="theme.cycle()"
      [attr.aria-label]="'Theme: ' + theme.mode() + '. Click to change.'"
      [title]="'Theme: ' + theme.mode() + ' (click to change)'">
      @if (theme.mode() === 'light') {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="currentColor" />
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </g>
      </svg>
      } @else if (theme.mode() === 'dark') {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" />
      </svg>
      } @else {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" />
      </svg>
      }
    </button>

    <!-- 2026-08-26: the mockup showed three color schemes (styles/_chrome.scss's
         ridgeline/command/nightwatch), but there was never a way to actually pick one - it
         was a compile-time edit to styles/_active-skin.scss, one line, then a rebuild. This
         is that made real: shared/services/skin.service.ts owns the choice, a `data-skin`
         attribute on <html> is all either stylesheet (styles.scss/_tokens.scss) reads. A
         menu, not a cycle button like the theme toggle above - three NAMED options read
         better as a list with the current one checked than as an unlabelled icon a scribe
         has to click through blind. -->
    <button type="button" class="skin-toggle" [matMenuTriggerFor]="skinMenu"
      aria-label="Color scheme" title="Color scheme">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="8" r="1.6" fill="currentColor" />
        <circle cx="8.2" cy="13" r="1.6" fill="currentColor" />
        <circle cx="15.8" cy="13" r="1.6" fill="currentColor" />
      </svg>
    </button>
    <mat-menu #skinMenu="matMenu">
      @for (opt of skins; track opt.value) {
      <button mat-menu-item (click)="skin.set(opt.value)">
        <span class="skin-swatch" [style.background]="opt.accent" aria-hidden="true"></span>
        {{ opt.label }}
        @if (skin.skin() === opt.value) {
        <span class="skin-check" aria-hidden="true">&check;</span>
        }
      </button>
      }
    </mat-menu>

    <!-- E-57(1) follow-up: install/update used to render here too, plus the footer's
         [stickyBottom] instance, plus a separate MatSnackBar UpdateService opened
         directly - three surfaces for the same "update ready" notice. Maintainer: "New
         version available shows up in three places. 1 is probably enough. (footer)." The
         footer's floating instance already guarantees visibility regardless of scroll
         and covers both states (install offer and update-ready), so this copy and the
         snackbar are both gone rather than trying to keep this one install-offer-only. -->
    <!-- 2026-09-02: was a 32x32 PNG (GitHub-Mark-32px.png), PageSpeed-flagged "serves images
         with low resolution" (rendered ~29x29 CSS px, PSI wants ~44x44 raw px at this
         device's pixel ratio - the 32px source can't cover that). Replaced with GitHub's
         own mark inlined as SVG, same pattern already used for every other icon in this
         template - scales crisply at any DPR/zoom with no separate asset request, and the
         #gitLogo `filter: invert(1)` dark-on-dark fix (navbar.component.scss) still applies
         via currentColor, so the invert hack is gone too, not just relocated. -->
    <a href=" https://github.com/SteadyEOC/RangerTrak" target="_blank"
      title="See ya at GitHub for issue reports & source code" class="git">
      <svg id="gitLogo" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
      </svg>
      <span class="visually-hidden">GitHub</span>
    </a>

  </span>
</nav>

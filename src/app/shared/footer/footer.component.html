<!-- https://nikitahl.com/horizontal-rule-css -->
<hr>
<div class="rt-footer">
  <div class="rt-footer__left">
    <span class="brand" [title]="versionTitle">RangerTrak™ ֍ Version {{version}}</span>
    <!-- E-55: was this component's own updateReady button, styled differently from the
         navbar's and Settings' install surfaces - see InstallUpdateComponent's doc comment.
         2026-08-21: [stickyBottom] now means position:sticky (see its own .scss comment for
         why `fixed` was actually a mismatch against this component's own documented intent)
         - a normal member of this row that pins to the viewport bottom only once scrolling
         would otherwise carry it away, rather than a small pill floating in a corner over
         page content regardless of where the footer itself is. -->
    <rangertrak-install-update [stickyBottom]="true"></rangertrak-install-update>
  </div>
  <!-- E-120: steadyeoc.com has no web page - this whole line used to link there. 2026-09-27
       (John): shorter wording, and the project phrase itself links to rangertrak.com "for
       now" (until steadyeoc.com has content). -->
  <span class="copyLeft">©2019–{{today | date: 'y'}} John Cornelison -
    <a href="https://rangertrak.com" target="_blank" rel="noopener">RangerTrak: a free,
      open-source project from SteadyEOC</a></span>
</div>

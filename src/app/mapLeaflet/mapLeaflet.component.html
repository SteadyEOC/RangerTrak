<div class="mapLeaflet-container">
  <div class="mapLeaflet-frame" #printFrame>
    <div #mapContainer id="mapLeaflet-main" (click)="onMouseClick($event)"></div>
    <!-- 2026-09-30, John: E-152 - north arrow and coordinate note, print-only (hidden on
         screen by the component itself), drawn over the corner of the map. -->
    <rangertrak-map-print-furniture [coordNote]="printCoordNote()"></rangertrak-map-print-furniture>
    <!-- 2026-09-30, John: lat/long ticks around the printed map's edge, print-only; filled
         in by refreshEdgeTicks() when the print layout takes over. -->
    <div #edgeTicks class="map-edge-ticks" aria-hidden="true"></div>
    <!-- 2026-10-01, John: E-152b - the printed title block and legend float over the map as
         panels (layoutPrintSheet() picks clear spots), instead of a band above and a column
         beside. Print-only. Where no spot is clear they fall back to the old band/column
         (frame classes rt-print-title-band / rt-print-legend-beside). -->
    <div #printTitle class="map-print-panel map-print-panel--title">
      <ng-container *ngTemplateOutlet="printTitleTemplate ?? null"></ng-container>
    </div>
    <rangertrak-map-print-legend #printLegend class="map-print-panel map-print-panel--legend"
      [entries]="legendEntries()" engine="leaflet" [overlays]="legendOverlays()"></rangertrak-map-print-legend>
  </div>
  <!-- Raised live 2026-08-30: "the mini-map should ideally be immediately underneath the
       main map if spacing allows" - was a later sibling of the WHOLE .mapLeaflet-container
       (lat/lng status, offline buttons, and all), so it floated down near the field-report
       toggle instead. Moved to right after the frame itself, still just a float:right (see
       mapLeaflet.component.scss) - the lat/lng status and offline buttons below now wrap to
       its left instead of it landing further down the page. -->
  <div #overviewContainer id="mapLeaflet-overview"></div>
  <!-- 2026-09-30, John: the position under the pointer (or the last tap, on a phone) in the
       format picked here; clicking the map copies it in the same format. -->
  <div class="map-print-hide map-coords">
    <mat-button-toggle-group class="map-coords__format" hideSingleSelectionIndicator
      [value]="coordFormat()" (change)="coordFormat.set($event.value)" aria-label="Coordinate format"
      data-testid="map-coord-format">
      <mat-button-toggle value="DD" title="Decimal degrees">DD</mat-button-toggle>
      <mat-button-toggle value="DDM" title="Degrees and decimal minutes (air operations)">DDM</mat-button-toggle>
      <mat-button-toggle value="USNG" title="US National Grid, the same grid as MGRS (ground search and rescue)">USNG</mat-button-toggle>
    </mat-button-toggle-group>
    <span class="strong" data-testid="map-coord-readout">{{mouseCoords()}}</span> Zoom:
    <span class="strong">{{zoom()}}</span>

    <div id="Lmap-status">Click map to copy coordinates</div>
  </div>

</div>
<!-- 2026-09-30, John: tidy the controls under the map (John, desktop screenshot: "a bit
     unorganized"). Top to bottom now: ONE row of actions, the offline-tile save/remove pair with
     a short note under it, and a small "Display" group holding the two switches. Nothing here
     has a clear: both any more, so the rows rise beside the floated mini-map instead of waiting
     below it (the tall empty gap). data-testids and ids are unchanged. -->
<div class="map-controls">
  <!-- Maintainer ask, 2026-09-22: re-fits the camera to whatever is drawn right now (reports
       honoring the All/selected switch, evidence markers, Location pins) - not the once-at-init
       fit to the whole log. data-testid, not a class - tools/e2e.js needs a stable hook and
       this repo has already been burned by e2e selectors hanging off styling classes. -->
  <button matButton="outlined" type="button" (click)="onBtnZoomToExtent()"
    data-testid="zoomToExtent" title="Zoom out until every report, evidence marker and location now shown fits on screen">
    <mat-icon>zoom_out_map</mat-icon>
    Zoom to Extent
  </button>

  <!-- 2026-09-30, John: E-138 - replaces the old "Saved offline tiles" layers-menu checkbox.
       Shows the blue saved-area overlay and zooms to it; pressed again, hides it.
       aria-pressed carries the on state (filled style in the scss); disabled, with the reason
       as hover text, until something has been saved on this device. -->
  <button matButton="outlined" type="button" (click)="onBtnZoomToOfflineTiles()"
    data-testid="zoomToOfflineTiles" [attr.aria-pressed]="offlineTilesShown()"
    [class.rt-toggled-on]="offlineTilesShown()" [disabled]="!hasOfflineTiles()"
    [attr.title]="hasOfflineTiles() ? 'Show the areas saved for offline use and zoom out to fit them all' : 'No offline tiles saved on this device yet'">
    <mat-icon>{{ offlineTilesShown() ? 'layers_clear' : 'offline_pin' }}</mat-icon>
    Zoom to offline tiles
  </button>

  <!-- G: prints the map alone (rt-print-map body class, styles.scss) - same approach as
       Radio Log's ICS-309 print and After Action's own onPrint(). -->
  <button matButton="outlined" type="button" (click)="onBtnPrintMap()" [disabled]="printPreparing()"
    data-testid="printMap" title="Print this map. Opens your browser's print dialog; choose your printer there">
    <mat-icon>print</mat-icon>
    {{ printPreparing() ? 'Preparing the map…' : 'Print map' }}
  </button>

  <!-- ADR D-49: arms the next plain map click to place a Location there instead of copying
       coordinates - see placingLocation's own comment (mapLeaflet.component.ts) for why this
       is one-shot rather than a persistent mode. Moved up into this row 2026-09-30. -->
  <button matButton="outlined" type="button" class="map-add-location" (click)="onToggleAddLocation()"
    [attr.aria-pressed]="placingLocation()">
    <mat-icon>add_location</mat-icon>
    {{ placingLocation() ? 'Click the map to place it…' : 'Add Location' }}
  </button>
</div>

<!-- Maintainer, 2026-08-24: the offline-save control (Save this area / Remove saved tiles)
     was floating over the map tiles as a Leaflet corner control - moved into normal page flow.
     initMainMap() re-parents the control's own DOM node in here after building it.
     2026-09-30: the two buttons sit side by side and their status text is a short note line
     under them (wireOfflineAreaInfo() appends it), no longer text inside the buttons. Now its
     own row rather than part of the action row above. -->
<!-- F29-21 (2026-08-30): id is a fragment-scroll target for the header readiness dot's
     "Offline map tiles saved" row - see mission-readiness.component.ts's own comment. -->
<div #offlineControlsHost id="readiness-offline-tiles" class="offline-controls"></div>

<!-- 2026-09-30, John: E-152 - .map-print-hide (styles.scss) keeps these interactive switches
     off the printed sheet. The two switches are one "Display" group now. data-testid, not a
     class - same reason mapEngineSwitch/zoomToExtent above carry one (tools/e2e.js#76 needs a
     stable hook, and this repo has already been burned by e2e selectors hanging off styling
     classes). The engine switch is projected from map-page via engineSwitchTemplate. -->
<div class="map-display map-print-hide" role="group" aria-label="Display">
  <div class="map-display__title">Display</div>
  <div class="map-display__row">
    Radio log entries to show: All ({{numAllRows()}})
    <mat-slide-toggle data-testid="allSelectedSwitch" (change)="onSwitchSelectedRadioLog()">
      Just those ({{numSelectedRows()}}) selected on the Radio Log page
    </mat-slide-toggle>
  </div>
  <ng-container *ngTemplateOutlet="engineSwitchTemplate"></ng-container>
  <!-- 2026-09-30, John: ring spacing, shown while the Range rings overlay is on. Far left is
       Auto (fits the zoom); the other stops are fixed distances. Not saved. -->
  @if (ringsOn()) {
    <div class="map-display__row map-ring-spacing">
      <label for="map-ring-spacing">Range ring spacing: <strong data-testid="ring-spacing-label">{{ ringSpacingLabel() }}</strong></label>
      <mat-slider min="0" [max]="ringStepCount" step="1" discrete [displayWith]="ringStepShort">
        <input matSliderThumb id="map-ring-spacing" data-testid="ring-spacing"
          [value]="ringStepIndex()" (input)="onRingStepChange(+$any($event.target).value)"
          [attr.aria-valuetext]="ringSpacingLabel()">
      </mat-slider>
    </div>
  }
</div>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>RangerTrak - Track Your Rangers</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="RangerTrak is a free, open-source radio log and ranger tracker for CERT, SAR, ACS and ham radio teams. It runs in the browser, works offline, and keeps your data on your own device.">
  <!-- SVG first: browsers that support it get a crisp mark at any DPI and the
       file's own prefers-color-scheme rule lightens the pin on a dark tab bar.
       favicon.ico stays for Safari and older browsers, which ignore the SVG. -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- E-62 cheap tier: iOS/iPadOS ignores favicon.ico and manifest.webmanifest's icons
       for "Add to Home Screen" - without this it fell back to a screenshot thumbnail
       instead of the app's actual mark. Flattened onto the maskable icon's own ground
       (#EDF1F5), same as the PWA maskable tiles, rather than left transparent - Apple's
       own guidance, since iOS composites this under its own rounded-corner mask and
       does not handle alpha well. Regenerated from assets/icons/app-icon-maskable.svg. -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">


  <!-- PageSpeed Insights (2026-08-29): Entry's own reverse-geocode of the mission's
       default position sits on the critical path (~956ms) on first load, and flagged
       Nominatim as a preconnect candidate (~310ms of that spent on DNS+TLS that
       preconnect can overlap with everything else loading). Only the connection is
       warmed here - no request is sent early, so this doesn't touch when/whether that
       geocode itself fires. -->
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>

  <!-- Self-hosted since 2026-09-22. These used to come from fonts.googleapis.com, which
       PageSpeed measured at 173 KiB and ~1,425 ms on the critical path - the largest
       third-party cost on the page.

       The point is not the milliseconds. This is an offline-first app, and a third-party
       font host is a network dependency in a product whose whole claim is that it works
       when the network does not. Same-origin means ngsw precaches these with everything
       else, so the UI renders identically offline.

       All the machinery this replaced is gone with it: the media="print" async swap, the
       <noscript> fallback, the preconnect to fonts.gstatic.com, and theme-init.js's
       load listener. A same-origin stylesheet of this size does not need deferring, and
       the CSP no longer has to allow either Google host.

       E-270 (2026-11-10): the @font-face rules are inline here, not in assets/fonts/fonts.css.
       That file was a render-blocking request of its own (PageSpeed, Slow 4G). style-src
       already allows inline styles. URLs are relative to <base href="/">.
       Roboto's non-latin subsets are dropped (English UI); latin-ext stays for accented names.
       The Material Icons file is a SUBSET built by tools/icon-font/; `npm run check:icons`
       fails if the app names an icon it lacks. The .material-icons rule is NOT optional:
       font-feature-settings 'liga' turns <i class="material-icons">emoji_people</i> into a
       glyph; without it the literal words render, wide enough to overflow a phone. -->
  <style>
    @font-face{font-family:'Faster One';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/faster-one-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:'Faster One';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/faster-one-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'Material Icons';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/material-icons-subset.woff2) format('woff2')}
    @font-face{font-family:'Roboto';font-style:normal;font-weight:400;font-stretch:100%;font-display:swap;src:url(assets/fonts/roboto-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:'Roboto';font-style:normal;font-weight:400;font-stretch:100%;font-display:swap;src:url(assets/fonts/roboto-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    .material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
  </style>
  <!-- E-193 (2026-10-16): fetch Roboto's latin file now, not when fonts.css is parsed and
       text first needs it. Found that late, it arrived ~0.3 s after first paint, and the swap
       from the fallback font (line-height: normal follows the font's metrics) pushed the Entry
       form down 4 px: CLS 0.014-0.06 on desktop. 22 KB, so it costs the main bundle nothing
       worth measuring. crossorigin is required for font preloads, even same-origin ones.
       2026-10-20: the icon font is preloaded too, now that it is an 8 KB subset (tools/icon-font/)
       rather than the full 128 KB font that would have competed with main.js on Slow 4G. Until it
       arrives, font-display: swap shows each icon as its literal name ("content_copy"). -->
  <link rel="preload" href="assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/material-icons-subset.woff2" as="font" type="font/woff2" crossorigin>

  <!-- E-42: theme-color was Angular Material's default blue (#1976d2), unrelated to the
       app's actual Command skin accent (#0B5FA8, ADR D-37) - this is what colors the
       browser chrome/status bar around an installed PWA, so it was one more place the
       Angular-default identity was leaking through. Was also duplicated (this link/meta
       pair appeared twice) and, above, a malformed meta tag that mixed an HTTP header
       fragment into an HTML attribute and never set a real theme-color value at all.

       REVISED 2026-09-22 (brand/palette integration): now --rt-chrome (#12263F), not the
       Command accent. In an installed PWA this colours the status bar, which sits directly
       above the navbar - and the navbar's background IS --rt-chrome, so the accent put a
       bright blue band above a navy bar. Matching chrome makes the two continuous. Also
       matches the home-screen tile's ground (assets/icons/rangertrak-tile.svg).
       NOTE: this narrows D-37, which chose the Command accent here. Keep both in step. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12263F">
  <!-- Pre-Angular theme and skin. It must run before the compiled stylesheet <link> the build
       adds at the end of this <head>, or a scribe who picked light/dark or a skin sees the
       default first, then a flip. So it blocks parsing on purpose; it is tiny.

       E-270 (2026-11-10): inline again. From 09-01 it was assets/theme-init.js, because the
       CSP is `script-src 'self'` with no 'unsafe-inline'; that cost a render-blocking round
       trip (~540 ms on Slow 4G). Now src/_headers allows exactly this script by its SHA-256
       hash. ANY edit to the script, even whitespace, changes the hash:
       `npm run check:csp-hash` (CI) fails and prints the new value to put in src/_headers.

       'themeMode' must match THEME_MODE_KEY (shared/services/theme.service.ts); 'auto' or
       nothing leaves color-scheme unset, so styles.scss's `light dark` default applies.
       'skinChoice' must match SKIN_KEY (shared/services/skin.service.ts); 'command' or nothing
       needs no attribute. A blocked localStorage falls back to the defaults. -->
  <script>try{var m=localStorage.getItem('themeMode');if(m==='light'||m==='dark')document.documentElement.style.colorScheme=m;var s=localStorage.getItem('skinChoice');if(s==='ridgeline'||s==='nightwatch'||s==='sagebrush'||s==='signal')document.documentElement.setAttribute('data-skin',s)}catch(e){}</script>
  <!-- E-44 audit, 2026-08-26: removed a dead SystemJS-era script comment, a mangled
       commented-out Leaflet CDN tag, and this What3Words SDK include - it loaded
       unconditionally with a blank ?key= on every page view for a feature that's shelved
       backlog (E-14, needs a real key + SDK version migration). Re-add once E-14 restores
       the feature for real. -->
</head>

<body class="mat-typography mat-app-background">

  <rangertrak-root></rangertrak-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>


</body>

</html>

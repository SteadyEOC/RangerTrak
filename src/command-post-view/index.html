<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RangerTrak Board</title>
<!-- Same files as the app's own icons: the Board server serves the built app's root, so these
     load from the scribe's laptop with no Internet. -->
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<!--
  E-87 Stage 1 (2026-08-31). Deliberately a hand-written static page, NOT an Angular route -
  see `E-87 Command Post Server.md` §2.3/§5 for why: this is served from a LAN IP, a THIRD
  origin distinct from both the real app and localhost, which means no service worker (not a
  secure context) and its own separate localStorage a scribe must never mistake for their own
  working copy. Routing this through the real Angular app would drag in the whole PWA bundle
  (including a service-worker registration that cannot work here anyway) for a page that only
  ever needs to render a JSON payload as a table. Plain HTML/CSS/vanilla JS, no build step, no
  CDN (the whole point is working on a LAN with no guaranteed upstream Internet - see
  artifact-capabilities-style reasoning in the scoping doc), no framework.

  Read-only. No write-back. ADR D-61 (2026-10-16): the scribe may set a viewers' password; this
  page keeps it in sessionStorage only (taken from the #code= part of the QR link, which the
  browser never sends to the server) and sends it as X-Board-Password. D-60: a report may carry
  attachments; a thumbnail click asks the scribe's device for the full-size file, and the page
  re-checks its SHA-256 itself before calling it verified.
-->
<style>
  :root {
    color-scheme: light dark;
    --ink: light-dark(#1a1a1a, #e8e8e8);
    --ink-2: light-dark(#555, #aaa);
    --ground: light-dark(#f7f7f5, #16181b);
    --surface: light-dark(#ffffff, #1e2127);
    --line: light-dark(#d8d8d4, #33363c);
    --accent: light-dark(#0b5fa8, #6fb3f2);
    --warn: light-dark(#b3261e, #ff6b5e);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1rem;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--ground);
    color: var(--ink);
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem 1rem;
    margin-bottom: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--line);
  }
  h1 { font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 0.45rem; align-self: center; }
  h1 img { width: 1.8rem; height: 1.8rem; flex: none; }
  .meta { color: var(--ink-2); font-size: 0.9rem; }
  .badge {
    display: inline-block;
    padding: 0.15em 0.6em;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .badge--live { background: light-dark(#e3f2e3, #1c3a24); color: light-dark(#1a6b1a, #6fd97f); }
  .badge--stale { background: light-dark(#fff3cd, #4a3a12); color: light-dark(#8a6100, #f2c94c); }
  .badge--none { background: light-dark(#fde3e1, #4a1d1a); color: var(--warn); }
  #themeToggle {
    margin-left: auto; align-self: center; padding: 0.3rem 0.7rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 0.85rem; cursor: pointer;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .controls input[type="search"] {
    flex: 1 1 200px;
    min-width: 0;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font-size: 1rem;
  }
  .controls button {
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  /* The browser's own link blue/purple is unreadable on the dark ground (2026-10-27). */
  a:link { color: var(--accent); }
  a:visited { color: color-mix(in oklab, var(--accent) 60%, var(--ink)); }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  caption { text-align: left; color: var(--ink-2); margin-bottom: 0.4rem; font-size: 0.85rem; }
  thead th {
    position: sticky; top: 0;
    background: var(--ground);
    text-align: left;
    padding: 0.5rem 0.6rem;
    border-bottom: 2px solid var(--line);
    white-space: nowrap;
  }
  /* Each header is a button, so sorting works from the keyboard; aria-sort on the <th> says which. */
  th button {
    border: none; background: none; padding: 0; color: inherit; font: inherit; font-weight: 700; cursor: pointer;
  }
  th button::after { content: ''; display: inline-block; width: 1em; color: var(--accent); }
  th[aria-sort="ascending"] button::after { content: ' ▲'; }
  th[aria-sort="descending"] button::after { content: ' ▼'; }
  th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--accent); }
  .mark-btn {
    border: none; background: none; padding: 0 0.2rem; cursor: pointer;
    font-size: 1.2rem; line-height: 1; color: var(--ink-2);
  }
  .mark-btn[aria-pressed="true"] { color: light-dark(#b07800, #f2c94c); }
  tbody tr.marked { background: light-dark(#fff8e1, #2e2a1a); }
  tbody tr.marked td:first-child { box-shadow: inset 4px 0 0 light-dark(#e0a800, #f2c94c); }
  tbody td {
    padding: 0.5rem 0.6rem;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:hover { background: light-dark(#eef3f8, #23272e); }
  .callsign { font-weight: 600; white-space: nowrap; }
  .msgno { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .status-pill {
    display: inline-block;
    padding: 0.1em 0.5em;
    border-radius: 4px;
    background: light-dark(#e8e8e8, #2a2d33);
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .time { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .empty { text-align: center; color: var(--ink-2); padding: 2rem 1rem; }

  /* Overflow-safe on a phone: this page gets no CSS breakpoint testing the way the real app
     does (E-102 audit, 2026-08-31), so the table just scrolls sideways rather than trying to
     reflow columns - simplest thing that can't silently widen the page the way this app's own
     Entry page overflow bug did. */
  .table-scroll { overflow-x: auto; }

  .meta--small { font-size: 0.8rem; }
  .notice { margin: 0 0 0.75rem; padding: 0.6rem 0.8rem; border-inline-start: 4px solid var(--accent); background: var(--surface); }
  .notice--warn { border-inline-start-color: var(--warn); }
  #pwForm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  /* The id rule's display beats the browser's own [hidden] rule, so without this the prompt
     showed on every Board, password or not (John, 2026-10-21). Same guard as #overlay's. */
  #pwForm[hidden] { display: none; }
  #pwForm input { padding: 0.5rem 0.75rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 1rem; }
  #pwForm button { padding: 0.5rem 0.9rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); color: var(--accent); font-size: 0.95rem; cursor: pointer; }

  .files { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; min-width: 5rem; }
  .file-btn {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 3.2rem; min-height: 3.2rem; padding: 0.15rem; overflow: hidden;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
    font-size: 0.65rem; cursor: pointer; word-break: break-all;
  }
  .file-btn img { width: 100%; height: 3rem; object-fit: cover; display: block; }
  .file-btn .icon { font-size: 1.2rem; }
  .file-btn .smaller-tag { display: block; font-size: 0.65rem; opacity: 0.85; }
  .more-btn { border: none; background: none; color: var(--accent); font: inherit; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }

  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(0, 0, 0, 0.7); }
  #overlay[hidden] { display: none; }
  .dialog { max-width: min(95vw, 60rem); max-height: 95vh; overflow: auto; padding: 1rem; border-radius: 8px; background: var(--surface); color: var(--ink); }
  .dialog img, .dialog video { max-width: 100%; max-height: 70vh; display: block; margin: 0.5rem 0; }
  .dialog audio { width: 100%; margin: 0.5rem 0; }
  .dialog h2 { font-size: 1rem; margin: 0 0 0.5rem; word-break: break-all; }
  .dialog .actions { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
  .verified { color: light-dark(#1a6b1a, #6fd97f); font-weight: 600; }
  .mismatch { color: var(--warn); font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1><img src="/assets/icons/rangertrak-mark.svg" alt="" width="29" height="29">RangerTrak Board</h1>
  <span id="missionMeta" class="meta">No log yet</span>
  <span id="statusBadge" class="badge badge--none">no data yet</span>
  <button id="themeToggle" type="button" title="Colours: follow this device, light, or dark">◐ Auto</button>
</header>
<p id="claimLine" class="meta" hidden></p>

<form id="pwForm" class="notice" hidden>
  <label for="pwInput">Password for this Board (ask the scribe):</label>
  <input id="pwInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button type="submit">Open</button>
  <span id="pwNote" role="status"></span>
</form>
<p id="notice" class="notice notice--warn" role="status" hidden></p>

<div class="controls">
  <input id="filterInput" type="search" placeholder="Filter by number, callsign, status, or message…" autocomplete="off">
  <button id="markedOnly" type="button" aria-pressed="false" title="Show only the reports marked with ★ on this device">★ Marked only</button>
</div>

<div class="table-scroll">
  <table>
    <caption>Read-only. Tap a heading to sort; tap ☆ to mark a report to come back to. Filter, sort and marks affect only this screen, and marks are kept on this device only - the scribe and other viewers never see them.</caption>
    <thead>
      <tr>
        <th aria-sort="none"><button type="button" data-sort="mark" aria-label="Marked">★</button></th>
        <th aria-sort="none"><button type="button" data-sort="msgno">Msg #</button></th>
        <th aria-sort="descending"><button type="button" data-sort="time">Time</button></th>
        <th aria-sort="none"><button type="button" data-sort="callsign">Callsign</button></th>
        <th aria-sort="none"><button type="button" data-sort="status">Status</button></th>
        <th aria-sort="none"><button type="button" data-sort="source">Source</button></th>
        <th aria-sort="none"><button type="button" data-sort="notes">Message</button></th>
        <th aria-sort="none"><button type="button" data-sort="files">Files</button></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<p id="emptyState" class="empty" hidden>No reports match.</p>

<div id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="dialog">
    <h2 id="ovTitle"></h2>
    <p id="ovStatus" role="status"></p>
    <div id="ovBody"></div>
    <div class="actions"><span id="ovDownload"></span><button id="ovClose" type="button">Close</button></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Same-origin only - this page is served BY the command post server itself
  // (tools/command-post-server.js), never loaded from anywhere else, so a relative path is
  // both correct and the only thing that could ever work (see the file header on why this
  // page can't be the real Angular app, and therefore can't share its origin either).
  var POLL_MS = 15000;
  var FETCH_POLL_MS = 2000;
  var FETCH_GIVE_UP_MS = 2 * 60 * 1000;
  var sortKey = 'time';
  var sortDir = -1; // -1 descending (newest first for Time), 1 ascending
  var markedOnly = false;
  var filterText = '';
  var latest = null;
  var password = '';
  var expanded = {}; // report id -> true when "+N more" was pressed

  var rowsEl = document.getElementById('rows');
  var emptyEl = document.getElementById('emptyState');
  var metaEl = document.getElementById('missionMeta');
  var badgeEl = document.getElementById('statusBadge');
  var claimEl = document.getElementById('claimLine');
  var noticeEl = document.getElementById('notice');
  var pwForm = document.getElementById('pwForm');
  var pwInput = document.getElementById('pwInput');
  var pwNote = document.getElementById('pwNote');
  var filterEl = document.getElementById('filterInput');
  var markedOnlyBtn = document.getElementById('markedOnly');
  var headRow = document.querySelector('thead tr');
  var themeBtn = document.getElementById('themeToggle');

  // ---- light / dark (John, 2026-10-21) ----
  // Every colour above is a light-dark() pair, so setting color-scheme on <html> is the whole
  // switch. Auto follows the device. Remembered per viewer device: a display preference only,
  // nothing a scribe could mistake for mission data.
  var THEMES = ['auto', 'light', 'dark'];
  var THEME_LABELS = { auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' };
  function applyTheme(t) {
    document.documentElement.style.colorScheme = t === 'auto' ? '' : t;
    themeBtn.textContent = THEME_LABELS[t];
    themeBtn.setAttribute('aria-label', 'Colours: ' + t + '. Click to change.');
  }
  var theme = 'auto';
  try { theme = localStorage.getItem('boardTheme') || 'auto'; } catch (e) { /* storage refused: Auto */ }
  if (THEMES.indexOf(theme) === -1) { theme = 'auto'; }
  applyTheme(theme);
  themeBtn.addEventListener('click', function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('boardTheme', theme); } catch (e) { /* kept for this visit only */ }
    applyTheme(theme);
  });

  // ---- the viewers' password (D-61) ----
  // From the QR link's #code=, kept for this tab only, and the hash removed so it is not left
  // in the address bar, the history or a shared screenshot.
  try {
    var m = /(?:^#|&)code=([^&]*)/.exec(location.hash);
    if (m) {
      var given = decodeURIComponent(m[1]);
      try { sessionStorage.setItem('boardPassword', given); } catch (e) { password = given; }
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) { /* a malformed hash: carry on without one */ }
  try { password = sessionStorage.getItem('boardPassword') || password; } catch (e) { /* storage refused: the prompt will ask */ }

  function api(path, opts) {
    opts = opts || {};
    opts.cache = 'no-store';
    opts.headers = opts.headers || {};
    if (password) { opts.headers['X-Board-Password'] = password; }
    return fetch(path, opts);
  }

  pwForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    password = pwInput.value;
    try { sessionStorage.setItem('boardPassword', password); } catch (e) { /* kept in memory only */ }
    pwInput.value = '';
    pwNote.textContent = '';
    poll();
  });

  function askPassword(note) {
    pwForm.hidden = false;
    pwNote.textContent = note || '';
    if (document.activeElement !== pwInput) { pwInput.focus(); }
  }

  function showNotice(text) {
    noticeEl.hidden = !text;
    noticeEl.textContent = text || '';
  }

  // For a sentence with a bold part: every piece is passed through esc() by the caller.
  function showNoticeHtml(html) {
    noticeEl.hidden = !html;
    noticeEl.innerHTML = html || '';
  }

  filterEl.addEventListener('input', function () {
    filterText = filterEl.value.trim().toLowerCase();
    render();
  });

  // ---- sorting (John, 2026-10-22) ----
  // A heading sorts by its column; the same heading again reverses it. Time, Files and ★ start
  // descending (newest, most, marked first), the text columns A-Z. Ties fall back to newest first.
  headRow.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('button[data-sort]') : null;
    if (!btn) { return; }
    var key = btn.getAttribute('data-sort');
    if (key === sortKey) { sortDir = -sortDir; }
    else { sortKey = key; sortDir = (key === 'time' || key === 'files' || key === 'mark') ? -1 : 1; }
    var ths = headRow.querySelectorAll('th');
    for (var i = 0; i < ths.length; i++) {
      var k = ths[i].querySelector('button').getAttribute('data-sort');
      ths[i].setAttribute('aria-sort', k !== sortKey ? 'none' : sortDir < 0 ? 'descending' : 'ascending');
    }
    render();
  });

  function fileCount(r) {
    return Array.isArray(r.attachments) ? r.attachments.length : (r.attachmentCount || 0);
  }

  // Sorts by station then number: 'A007' -> letter, then the digits as a number.
  function msgNoSeq(r) {
    var m = /^([A-Z])(\d+)$/.exec(r.msgNo || '');
    return m ? m[1].charCodeAt(0) * 1000000 + parseInt(m[2], 10) : 0;
  }

  function sortValue(r) {
    switch (sortKey) {
      case 'mark': return isMarked(r) ? 1 : 0;
      case 'files': return fileCount(r);
      case 'msgno': return msgNoSeq(r);
      case 'callsign': return station(r.tacticalCall, r.callsign).toLowerCase();
      case 'status': return (r.status || '').toLowerCase();
      case 'source': return (r.source || '').toLowerCase();
      case 'notes': return (r.notes || '').toLowerCase();
      default: return new Date(r.date).getTime() || 0;
    }
  }

  function compareReports(a, b) {
    var va = sortValue(a), vb = sortValue(b);
    var d = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    if (d) { return d * sortDir; }
    return (new Date(b.date) - new Date(a.date)) || 0;
  }

  // ---- marks (John, 2026-10-22) ----
  // A viewer's own reminder to come back to a report. Kept in this device's localStorage, so it
  // survives a refresh but is per device AND per address (the .local name and the IP are
  // different origins, so each has its own marks). Never sent to the scribe: this page stays
  // read-only. Keyed on id + time because ids restart with each mission's log.
  var MARKS_KEY = 'boardMarks';
  var MAX_MARKS = 500;
  var marks = {};
  try { marks = JSON.parse(localStorage.getItem(MARKS_KEY) || '{}') || {}; } catch (e) { marks = {}; }
  if (typeof marks !== 'object' || Array.isArray(marks)) { marks = {}; }

  function markKey(r) { return String(r.id) + '@' + String(r.date); }
  function isMarked(r) { return Object.prototype.hasOwnProperty.call(marks, markKey(r)); }

  function toggleMark(key) {
    if (Object.prototype.hasOwnProperty.call(marks, key)) { delete marks[key]; }
    else {
      marks[key] = Date.now();
      // Oldest marks go first once there are too many, so storage cannot grow without limit.
      var keys = Object.keys(marks);
      if (keys.length > MAX_MARKS) {
        keys.sort(function (a, b) { return marks[a] - marks[b]; });
        keys.slice(0, keys.length - MAX_MARKS).forEach(function (k) { delete marks[k]; });
      }
    }
    try { localStorage.setItem(MARKS_KEY, JSON.stringify(marks)); } catch (e) { /* kept for this visit only */ }
    render();
  }

  markedOnlyBtn.addEventListener('click', function () {
    markedOnly = !markedOnly;
    markedOnlyBtn.setAttribute('aria-pressed', String(markedOnly));
    render();
  });

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  // For a value inside a double-quoted attribute: esc() leaves quotes alone.
  function escAttr(s) {
    return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtTime(iso) {
    try {
      // 24-hour clock throughout RangerTrak's own UI - matched here for consistency,
      // not a browser-locale default.
      return new Date(iso).toLocaleString([], {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
      });
    } catch (e) { return iso; }
  }

  function fmtClock(iso) {
    try {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    } catch (e) { return iso; }
  }

  // "Fernhollow Search, op period 2: published by K7ABC (Chrome on Windows), 14:02"
  function claimText(board) {
    var by = board.by || {};
    var text = (by.mission || '(unnamed mission)') + ', op period ' + (by.opPeriod || '?')
      + ': published by ' + (by.scribe || '(unnamed)') + (by.agent ? ' (' + by.agent + ')' : '')
      + (board.at ? ', ' + fmtClock(board.at) : '');
    if (board.previous && board.previous.by) {
      text += ' (took over from ' + (board.previous.by.scribe || 'another device') + ')';
    }
    return text;
  }

  function renderClaim(board) {
    if (!board) { claimEl.hidden = true; return; }
    claimEl.hidden = false;
    claimEl.innerHTML = esc(claimText(board)) + ' <span class="meta--small">· '
      + (board.open ? 'Open to this network' : 'Password required') + '</span>';
  }

  // ---- attachments in a row (D-60) ----
  var THUMB_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
  var SHA_RE = /^[0-9a-f]{64}$/;

  function iconFor(type) {
    if (/^audio\//.test(type)) { return '🔊'; }
    if (/^video\//.test(type)) { return '🎬'; }
    return '📄';
  }

  function fileButton(a) {
    var label = esc(a.name || 'file');
    var inner = typeof a.thumb === 'string' && THUMB_RE.test(a.thumb)
      ? '<img src="' + a.thumb + '" alt="' + escAttr(a.name || 'attachment') + '">'
      : '<span class="icon" aria-hidden="true">' + iconFor(a.type || '') + '</span><span>' + label + '</span>';
    // A smaller copy says so: the scribe's device sends the label with the reference (D-60 item 2, revised).
    var kind = typeof a.smallerCopy === 'string' && a.smallerCopy ? a.smallerCopy : '';
    var tag = kind ? '<span class="smaller-tag">smaller copy</span>' : '';
    return '<button type="button" class="file-btn" data-sha="' + escAttr(a.sha256) + '" title="' + escAttr(kind || a.name || '') + '">' + inner + tag + '</button>';
  }

  function filesCell(r) {
    if (Array.isArray(r.attachments)) {
      var valid = r.attachments.filter(function (a) { return a && SHA_RE.test(a.sha256 || ''); });
      var shown = expanded[r.id] ? valid : valid.slice(0, 4);
      var more = valid.length - shown.length;
      return '<div class="files">' + shown.map(fileButton).join('')
        + (more > 0 ? '<button type="button" class="more-btn" data-more="' + escAttr(r.id) + '">+' + more + ' more</button>' : '')
        + '</div>';
    }
    if (r.attachmentCount > 0) { return '📎 ' + esc(r.attachmentCount); }
    return '';
  }

  function findAttachment(sha) {
    var reports = (latest && latest.reports) || [];
    for (var i = 0; i < reports.length; i++) {
      var list = reports[i].attachments || [];
      for (var j = 0; j < list.length; j++) { if (list[j].sha256 === sha) { return list[j]; } }
    }
    return null;
  }

  rowsEl.addEventListener('click', function (ev) {
    var t = ev.target;
    var btn = t && t.closest ? t.closest('button') : null;
    if (!btn) { return; }
    if (btn.hasAttribute('data-mark')) { toggleMark(btn.getAttribute('data-mark')); return; }
    if (btn.hasAttribute('data-more')) { expanded[btn.getAttribute('data-more')] = true; render(); return; }
    var sha = btn.getAttribute('data-sha');
    var a = sha && findAttachment(sha);
    if (a) { openOverlay(a); }
  });

  function render() {
    if (!latest) {
      rowsEl.innerHTML = '';
      emptyEl.hidden = false;
      emptyEl.textContent = 'Nothing yet. The log appears here once the scribe turns on sending to this Board.';
      return;
    }

    metaEl.textContent = (latest.mission || '(unnamed mission)')
      + (latest.opPeriod ? ' — ' + latest.opPeriod : '');

    var reports = (latest.reports || []).slice();
    var markedCount = reports.filter(isMarked).length;
    markedOnlyBtn.textContent = '★ Marked only' + (markedCount ? ' (' + markedCount + ')' : '');
    if (markedOnly) { reports = reports.filter(isMarked); }
    if (filterText) {
      reports = reports.filter(function (r) {
        return (r.callsign || '').toLowerCase().indexOf(filterText) !== -1
          || (r.tacticalCall || '').toLowerCase().indexOf(filterText) !== -1
          || (r.status || '').toLowerCase().indexOf(filterText) !== -1
          || (r.msgNo || '').toLowerCase().indexOf(filterText) !== -1
          || (r.notes || '').toLowerCase().indexOf(filterText) !== -1;
      });
    }
    reports.sort(compareReports);

    if (!reports.length) {
      rowsEl.innerHTML = '';
      emptyEl.hidden = false;
      emptyEl.textContent = filterText ? 'No reports match that filter.'
        : markedOnly ? 'No marked reports. Tap ☆ on a row to mark it.' : 'No reports yet this mission.';
      return;
    }
    emptyEl.hidden = true;

    rowsEl.innerHTML = reports.map(function (r) {
      var marked = isMarked(r);
      return '<tr' + (marked ? ' class="marked"' : '') + '>'
        + '<td><button type="button" class="mark-btn" data-mark="' + escAttr(markKey(r)) + '" aria-pressed="' + marked
        + '" aria-label="' + (marked ? 'Marked. Tap to unmark' : 'Mark this report') + '">' + (marked ? '★' : '☆') + '</button></td>'
        + '<td class="msgno" title="' + escAttr(r.msgNoFull || '') + '">' + esc(r.msgNo || '') + '</td>'
        + '<td class="time">' + esc(fmtTime(r.date)) + '</td>'
        + '<td class="callsign">' + esc(station(r.tacticalCall, r.callsign) || '(not given)')
        + (station(r.toTactical, r.toCallsign) ? ' &rarr; ' + esc(station(r.toTactical, r.toCallsign)) : '') + '</td>'
        + '<td>' + (r.status ? '<span class="status-pill">' + esc(r.status) + '</span>' : '') + '</td>'
        + '<td>' + esc(r.source) + '</td>'
        + '<td>' + esc(r.notes) + '</td>'
        + '<td>' + filesCell(r) + '</td>'
        + '</tr>';
    }).join('');
  }

  // E-165: same "CERT Team 1 (K7ABC)" format as the app's own Radio Log (station-label.ts).
  function station(tactical, callsign) {
    var t = (tactical || '').trim(), c = (callsign || '').trim();
    return t && c ? t + ' (' + c + ')' : (t || c);
  }

  function setBadge(state, text) {
    badgeEl.className = 'badge badge--' + state;
    badgeEl.textContent = text;
  }

  // E-216: when the Board last answered, and the Wi-Fi name it gave, for the "lost" message below.
  var lastGoodAt = 0;
  var lastWifi = '';
  var firstFailAt = 0;

  // The two sentences below are the shared causes `board-lost` and `scribe-quiet` in
  // src/app/domain/board-causes.json. This page cannot import it, so the words are copied here;
  // tools/board/causes.test.js fails if they drift apart.
  function boardLostHtml(atMs, ssid) {
    return 'Lost the Board at ' + esc(fmtClock(atMs)) + '.' +
      (ssid ? ' Still on <strong>' + esc(ssid) + '</strong>?' : '') +
      ' Is the Board laptop awake?';
  }
  function scribeQuietText(minutes) {
    return "The Board is fine. The scribe's device last checked in " + minutes + ' min ago.';
  }
  function fmtClock(ms) {
    try { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }
  var SCRIBE_QUIET_MS = 2 * 60 * 1000;

  function poll() {
    api('/api/mission')
      .then(function (res) {
        if (res.ok || res.status === 401 || res.status === 429) { lastGoodAt = Date.now(); firstFailAt = 0; }
        if (res.status === 401) {
          latest = null;
          renderClaim(null);
          setBadge('none', 'password needed');
          askPassword(password ? 'That password did not work.' : '');
          showNotice('');
          render();
          return;
        }
        if (res.status === 429) {
          setBadge('none', 'wait');
          askPassword('');
          showNotice('Too many wrong passwords. Wait a minute.');
          return;
        }
        if (!res.ok) { throw new Error('HTTP ' + res.status); }
        return res.json().then(function (data) { pwForm.hidden = true; showNotice(''); return data; });
      })
      .then(function (data) {
        if (!data) { return; }
        if (data.waiting) {
          latest = null;
          renderClaim(null);
          setBadge('none', 'waiting');
          render();
          return;
        }
        latest = data;
        renderClaim(data.board);
        if (data.board && data.board.wifi) { lastWifi = String(data.board.wifi); }
        var seen = data.board && data.board.scribeSeenAt ? new Date(data.board.scribeSeenAt).getTime() : NaN;
        var quietMs = Date.now() - seen;
        if (isFinite(quietMs) && quietMs > SCRIBE_QUIET_MS) {
          setBadge('stale', 'scribe quiet');
          showNotice(scribeQuietText(Math.floor(quietMs / 60000)));
        } else {
          setBadge('live', 'live');
        }
        render();
      })
      .catch(function (e) {
        // The last data stays on screen (latest is not cleared); only the badge and the notice change.
        if (!lastGoodAt && !firstFailAt) { firstFailAt = Date.now(); }
        setBadge('none', 'lost');
        showNoticeHtml(boardLostHtml(lastGoodAt || firstFailAt, lastWifi));
        console.warn('Command Post view: could not reach /api/mission -', e);
      });
  }

  // ---- the full-size file (D-60): ask the scribe, wait, check the fingerprint, then show ----
  var ov = {
    root: document.getElementById('overlay'), title: document.getElementById('ovTitle'),
    status: document.getElementById('ovStatus'), body: document.getElementById('ovBody'),
    download: document.getElementById('ovDownload'), close: document.getElementById('ovClose')
  };
  var ovToken = 0; // a new open (or a close) cancels whatever the last one was waiting on
  var ovUrl = '';

  function closeOverlay() {
    ovToken++;
    ov.root.hidden = true;
    ov.body.innerHTML = '';
    ov.download.innerHTML = '';
    if (ovUrl) { URL.revokeObjectURL(ovUrl); ovUrl = ''; }
  }
  ov.close.addEventListener('click', closeOverlay);
  ov.root.addEventListener('click', function (ev) { if (ev.target === ov.root) { closeOverlay(); } });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !ov.root.hidden) { closeOverlay(); } });

  function hex(buffer) {
    return Array.prototype.map.call(new Uint8Array(buffer), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  function openOverlay(att) {
    closeOverlay();
    var token = ovToken;
    var started = Date.now();
    ov.root.hidden = false;
    ov.title.textContent = (att.name || 'Attachment') + (typeof att.smallerCopy === 'string' && att.smallerCopy ? ' - ' + att.smallerCopy : '');
    ov.status.className = '';
    ov.status.textContent = 'Fetching from the scribe…';
    ov.close.focus();

    function fail(text) { if (token === ovToken) { ov.status.textContent = text; } }

    function fetchOnce() {
      if (token !== ovToken) { return; }
      api('/api/attachments/' + att.sha256).then(function (res) {
        if (token !== ovToken) { return; }
        if (res.status === 200) {
          var type = res.headers.get('Content-Type') || att.type || 'application/octet-stream';
          return res.arrayBuffer().then(function (bytes) { show(bytes, type); });
        }
        if (res.status === 202) { again(); return; }
        if (res.status === 401 || res.status === 429) { fail('The Board needs its password again. Close this and try once more.'); return; }
        fail('The scribe’s device no longer has this file.');
      }).catch(function () { again(); });
    }

    function again() {
      if (Date.now() - started > FETCH_GIVE_UP_MS) {
        fail('The scribe’s device did not send it. It may be offline, or may not hold this file. Try again later.');
        return;
      }
      setTimeout(fetchOnce, FETCH_POLL_MS);
    }

    function show(bytes, type) {
      if (token !== ovToken) { return; }
      // Never trust the scribe's device or the network to have delivered the right file: hash it here.
      var check = window.crypto && crypto.subtle
        ? crypto.subtle.digest('SHA-256', bytes).then(function (d) { return hex(d) === att.sha256; })
        : Promise.resolve(null);
      check.then(function (ok) {
        if (token !== ovToken) { return; }
        if (ok === true) {
          ov.status.className = 'verified';
          ov.status.textContent = '✓ Verified';
        } else {
          ov.status.className = 'mismatch';
          ov.status.textContent = ok === false
            ? '⚠ Doesn’t match the scribe’s fingerprint: don’t rely on this copy'
            : '⚠ This browser can’t check the fingerprint here: don’t rely on this copy';
        }
        ovUrl = URL.createObjectURL(new Blob([bytes], { type: type }));
        var el = null;
        if (/^image\//.test(type)) { el = document.createElement('img'); el.alt = att.name || ''; }
        else if (/^video\//.test(type)) { el = document.createElement('video'); el.controls = true; }
        else if (/^audio\//.test(type)) { el = document.createElement('audio'); el.controls = true; }
        if (el) { el.src = ovUrl; ov.body.appendChild(el); }
        var a = document.createElement('a');
        a.href = ovUrl;
        a.download = att.name || 'attachment';
        a.textContent = 'Download';
        ov.download.appendChild(a);
      });
    }

    api('/api/request/' + att.sha256, { method: 'POST' }).then(function (res) {
      if (token !== ovToken) { return; }
      if (res.status === 200 || res.status === 202) { fetchOnce(); return; }
      if (res.status === 404) { fail('That file is no longer on the Board.'); return; }
      fail('The Board could not ask for that file (HTTP ' + res.status + ').');
    }).catch(function () { fail('The Board could not be reached.'); });
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RangerTrak">
  <title>RangerTrak</title>
  <defs>
    
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="pinShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feOffset dx="7" dy="12" result="off"/>
      <feGaussianBlur in="off" stdDeviation="11" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="pinClip"><path d="M 256 430 L 152.08 250.00 A 120 120 0 1 1 359.92 250.00 Z"/></clipPath>
  
    
    <linearGradient id="pinFillC" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#22456E"/>
      <stop offset="1" stop-color="#12263F"/>
    </linearGradient>
  
  </defs>
  
  <!-- Scaled up so the narrow pin fills the tile's height like other desktop app icons do;
       the maskable icon stays at its original size to respect Android's safe zone. -->
  <g transform="translate(256 244) scale(1.22) translate(-256 -250)">

    <path d="M 256 430 L 152.08 250.00 A 120 120 0 1 1 359.92 250.00 Z" fill="none" stroke="#F0700A" stroke-width="15" filter="url(#pinShadow)"/>
    <path d="M 256 430 L 152.08 250.00 A 120 120 0 1 1 359.92 250.00 Z" fill="url(#pinFillC)"/>
  
    <g clip-path="url(#pinClip)">
      
    <g fill="#D7DEE6">
    <rect x="212" y="214" width="88" height="122" rx="20"/>
    <rect x="250" y="166" width="12" height="54" rx="6"/>
    <circle cx="256" cy="152" r="15"/>
  </g>
    <path d="M 268.98 112.06 A 42 42 0 0 1 297.59 157.85" fill="none" stroke="#F0700A" stroke-width="11" stroke-linecap="round"/><path d="M 275.78 91.13 A 64 64 0 0 1 319.38 160.91" fill="none" stroke="#F0700A" stroke-width="9" stroke-linecap="round"/><path d="M 282.58 70.21 A 86 86 0 0 1 341.16 163.97" fill="none" stroke="#F0700A" stroke-width="7" stroke-linecap="round"/>
    
    <rect x="234" y="232" width="44" height="11" rx="5.5" fill="#12263F"/>
    <rect x="234" y="256" width="44" height="11" rx="5.5" fill="#12263F"/>
    <rect x="234" y="280" width="44" height="11" rx="5.5" fill="#12263F"/>
  
  
    </g>
  </g>
</svg>
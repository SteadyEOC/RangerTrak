  </g>
  <path d="M36 14 L64 24 L64 92 L36 82 Z" fill="#0B5563" fill-opacity=".12"/>
  <path d="M15 77 Q28 56 42 64 T64 52" fill="none" stroke="#F0700A" stroke-width="8" stroke-linecap="round" stroke-dasharray="0.1 11"/>
  <path d="M73 55 L61.74 35.5 A13 13 0 1 1 84.26 35.5 Z" fill="#0B5563"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 8 92 88" width="92" height="88" role="img" aria-label="RangerView">
  <title>RangerView</title>
  <!--
    RangerView's mark (E-305, chosen by John 2026-11-15): a folded paper map in teal, a dotted
    route in RangerTrak's orange, and a pin whose centre is the same orange. Studies:
    non-dist-imgs/RangerView mark studies.html ("Folded map, brighter route").
    Colours are plain attributes, as in rangertrak-mark.svg, so every renderer draws them.
  -->
